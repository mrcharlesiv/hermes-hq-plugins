name: hermes-hq-push
version: "0.9.9"
manifest_version: 2
kind: standalone
description: "Apple push notifications for the Hermes HQ iPhone app: finished turns (who replied and what they said) and approvals (the command), with Approve/Deny from the lock screen; a bot waiting for a password, login, code or answer (the site or question, never the value). Also adds the Hermes HQ theme to the Hermes desktop app, stops a bot's one-time restart from looping (launchctl submit) and locking the app out, and keeps the app's performance log on this computer (~/.hermes/hq-logs). Lets a Nous sign-in delete, archive and rename the chats it made (Hermes refuses them otherwise), and the chats the old password login made, once you name the login that takes them over. Tells the app which scheduled jobs a bot is still working on. When you ask in the app, posts the bot's answer back to the Telegram or Discord chat a conversation came from. Replaces dispatch-push (its registered phones carry over)."
author: Hermes HQ
provides_tools: []
provides_hooks: [pre_approval_request, post_approval_response, pre_tool_call, on_human_input_request, on_human_input_resolved]
optional_env:
  - name: HERMES_HQ_APNS_KEY_PATH
    description: "Direct mode: path to the app's APNs auth key (.p8). Only the app's developer has this. (DISPATCH_APNS_KEY_PATH still works.)"
  - name: HERMES_HQ_APNS_KEY_ID
    description: "Direct mode: the APNs key's Key ID (DISPATCH_APNS_KEY_ID still works)"
  - name: HERMES_HQ_APNS_TEAM_ID
    description: "Direct mode: the Apple Developer Team ID that owns the app (DISPATCH_APNS_TEAM_ID still works)"
  - name: HERMES_HQ_PUSH_RELAY_URL
    description: "Another push relay's HTTPS URL, or `off` to send nothing. Unset, alerts go through the public Hermes HQ relay, sealed so it can't read them. (DISPATCH_PUSH_RELAY_URL still works.)"
  - name: HERMES_HQ_PUSH_RELAY_KEY
    description: "Only for a private relay that asks for a key (DISPATCH_PUSH_RELAY_KEY still works)"
    password: true
