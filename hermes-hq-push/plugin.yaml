name: hermes-hq-push
version: "0.9.88"
manifest_version: 2
kind: standalone
description: "Suggests shorter task titles without renaming a task until you accept. Apple push notifications for the Hermes HQ iPhone app: finished turns (who replied and what they said) and approvals (the command), with Approve/Deny from the lock screen; a bot waiting for a password, login, code or answer (the site or question, never the value). Also adds the Hermes HQ theme to the Hermes desktop app, stops a bot's one-time restart from looping (launchctl submit) and locking the app out, and keeps the app's performance log on this computer (~/.hermes/hq-logs). Lets a Nous sign-in delete, archive and rename the chats it made (Hermes refuses them otherwise), and the chats the old password login made, once you name the login that takes them over. Lets the desktop app open the chats the app made (Hermes answers not_found otherwise). Asks a bot in an app chat to put a question it needs answered on a card you tap (clarify) rather than in text. Keeps the Sessions list fast on a bot that has run many scheduled jobs (Hermes read every chat's first message to show one page). Tells the app which scheduled jobs a bot is still working on. Lets the app send into a chat the desktop app has open. Lets a bot ask you for a login, a one-time code or a password manager unlock when another bot's message or a hand-off started its turn (Hermes refused to ask then), and asks for the login of the site the bot is signing in to, not another site's tab left open, including a sign-in that sits inside the page (as DoorDash's does), so the login or code you type goes into it. Lets your bots use what you share from your phone in the app (Settings › Device Access): look someone up in your contacts, see where you are, read and add reminders and events, set alarms and timers, find and fetch photos, read the Health data you switch on (any kind the Health app has), motion and music, and leave an email or text for you to send. When you ask in the app, posts the bot's answer back to the Telegram or Discord chat a conversation came from. Tells a restart script which chats typed in the app are mid-reply, so a restart can wait for them. Keeps a bot's Lock Screen card in the app live while the phone is locked: each step the bot takes (Running npm test…, the two before it, how many) is pushed to the card, sealed so only your phone can read it, and the card says Done when the turn ends. Opens a shell on this computer for the app's Terminal page (your login shell, as an SSH login would, or PowerShell on Windows; plugin-data's terminal.off turns it off). Mints the app's Grok Live voice session a short-lived xAI token from your Grok subscription sign-in only, never an API key (the bearer itself never reaches the phone). Keeps the names Hermes gives new chats short enough for one line of an iPhone screen. Gives your bots a skill for the app's Dashboard (hermes-hq-push:dashboard-tile): a page that fills its tile at any size, checked at every size, kept fresh by a scheduled job. Adds a shared Tasks list between you and your bots: a task can be yours, a bot's, or split into steps for each of you; a bot can flag its own work to get ready ahead of time (research and drafts only — never send, book, buy, pay, post or delete), and tells you on your phone when its part is ready or needs you. Once you turn on Ideas, one or more bots look over the sources you choose each day (recent chats, memory, local files, web search, and any connected MCP or Composio apps you switch on — all connected apps start off, and off sources and writes are blocked at the tool layer) and suggest a few tasks on the Tasks page's Suggested tab (nothing becomes a task until you add it). Keeps the pictures a scheduled job sends to a bot when that bot sums the job up in its chat. Lets you finish, from the app, a plugin update Hermes only applies from a terminal because it adds Python packages: the app shows you the packages, and on your yes this computer runs hermes plugins update and answers that question. A list on the Tasks page has a colour, an icon and a bot that keeps it; a bot offers a list or a batch of tasks as one card you accept or decline (with Undo) instead of making it itself; a task a bot adds says where it came from, and the same message never becomes two tasks; a finished task takes nothing more, and a bot offers to close your task instead of closing it. Lets you allow 1Password for your bots from the app with no master password: the 1Password app on this computer asks you to allow it, you pick the vaults, and a read-only key for them is saved for your bots (made with 1Password's own op tool; it never leaves this computer). Shows the products a bot finds as product cards in the app (photo, price, store; Buy and Notify Me on each one's page), and an order the bot has taken to the last step of checkout as a card with Cancel and Pay: nothing is paid until you tap Pay (the add-on pays for nothing itself). Lets a bot ask before it acts for you (answering someone, replying, booking, changing something) as one card you answer with a tap: who asked and their words, a link to the conversation, a button per choice, and the reply it would send for each choice, with Send and Edit; nothing is sent until you tap Send. It works when a scheduled job's report reaches the bot's chat too. Holds a bot's question card until a picture it made for that question is in the chat, so you never pick between pictures you haven't seen. Shows in the app where a chat's code changes stand: on a branch not merged yet, merged into main but not public yet, or merged (and a pull request the chat opened itself: draft, open, merged, closed). When a chat has more than one pull request or branch, the app is told each one, and a chat with work still waiting never reads as finished because another one merged. You can mark a chat's changes closed from the app (a label only), and link each project to its repository from the app instead of a file; a branch deleted without merging shows as closed. It reads the branches the chat itself made, in the repositories you link or list, and asks GitHub only about repositories you list as public or with a token of your own (never this computer's GitHub sign-in). Keeps your goals beside your tasks: a finish line, a day, a number, milestones, and the tasks under them. Lets bots help on a goal you give them: one bot leads it and others help; the lead offers a plan and a short weekly check-in as cards you tap, keeps where the goal stands and its Goal Page, and reads the goal's number only when you say it may; a bot never ticks your task, a milestone or the goal itself, and the check-in does research and drafts only. A coding project's chats report the size of their unmerged changes and a waiting pull request's checks, and the app's pull request card lists the changed files. Bots make pages for the app from a starter in its look and check them at phone size (the html-page skill). Bots name the background jobs they start, so the app can say what each is for. A bot asks before putting a task of yours under a goal, and says so as a question. A bot's plan for a goal can set the goal's name, why, date and number and says what it is built on (goal set-up). A bot marks your task done when you tell it to in the chat; otherwise it offers Mark Done. A task a bot offers for a goal carries what it needs (the notes, page, link or file it names), so you never go looking. Shows the flights and hotels a bot finds as travel cards in the app (times, stops, fare and bag rules; photo, rating, nightly rate and cancellation), with Book and Watch Price on each: a booking stops at an order card you tap Pay on. An email draft card shows its Cc and Bcc, and Send goes to exactly those people. Each item on an order card opens its own product page. A connector tool you set to Needs approval or Auto-review in the app asks you before it runs (with what it is about to do), instead of the setting doing nothing. A bot asks once before it buys: it gets the order ready with what you already told it or have saved, then asks about the items, the total, the address and the payment together. When something a task waited on comes through (a payment you approved), the task says so and offers to finish it instead of waiting quietly. A card fill a bot asks you to confirm, and an MCP server's question, alert your phone like a command does. A bot shows the flights, hotels and products it finds as cards instead of a table, also when it has so many tools that Hermes tucks the card tools away. Replaces dispatch-push (its registered phones carry over)."
author: Hermes HQ
provides_tools: [device_contacts_search, device_request_result, tasks_list, tasks_add, tasks_update, tasks_offer, tasks_next_prep, tasks_ideas, goals_list, goals_offer, goals_update, goals_next_review]
provides_hooks: [pre_approval_request, post_approval_response, pre_tool_call, on_human_input_request, on_human_input_resolved, pre_llm_call, transform_llm_output, transform_tool_result, on_session_end]
optional_env:
  - name: HERMES_HQ_APNS_KEY_PATH
    description: "Direct mode: path to the app's APNs auth key (.p8). Only the app's developer has this. (DISPATCH_APNS_KEY_PATH still works.)"
  - name: HERMES_HQ_APNS_KEY_ID
    description: "Direct mode: the APNs key's Key ID (DISPATCH_APNS_KEY_ID still works)"
  - name: HERMES_HQ_APNS_TEAM_ID
    description: "Direct mode: the Apple Developer Team ID that owns the app (DISPATCH_APNS_TEAM_ID still works)"
  - name: HERMES_HQ_PUSH_RELAY_URL
    description: "Another push relay's HTTPS URL, or `off` to send nothing. Unset, alerts go through the public Hermes HQ relay, sealed so it can't read them. (DISPATCH_PUSH_RELAY_URL still works.)"
  - name: HERMES_HQ_PUSH_RELAY_KEY
    description: "Only for a private relay that asks for a key (DISPATCH_PUSH_RELAY_KEY still works)"
    password: true
