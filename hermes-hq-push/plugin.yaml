name: hermes-hq-push
version: "0.9.39"
manifest_version: 2
kind: standalone
description: "Apple push notifications for the Hermes HQ iPhone app: finished turns (who replied and what they said) and approvals (the command), with Approve/Deny from the lock screen; a bot waiting for a password, login, code or answer (the site or question, never the value). Also adds the Hermes HQ theme to the Hermes desktop app, stops a bot's one-time restart from looping (launchctl submit) and locking the app out, and keeps the app's performance log on this computer (~/.hermes/hq-logs). Lets a Nous sign-in delete, archive and rename the chats it made (Hermes refuses them otherwise), and the chats the old password login made, once you name the login that takes them over. Lets the desktop app open the chats the app made (Hermes answers not_found otherwise). Asks a bot in an app chat to put a question it needs answered on a card you tap (clarify) rather than in text. Keeps the Sessions list fast on a bot that has run many scheduled jobs (Hermes read every chat's first message to show one page). Tells the app which scheduled jobs a bot is still working on. Lets the app send into a chat the desktop app has open. Lets a bot ask you for a login, a one-time code or a password manager unlock when another bot's message or a hand-off started its turn (Hermes refused to ask then). Lets your bots use what you share from your phone in the app (Settings › Device Access): look someone up in your contacts, see where you are, read and add reminders and events, set alarms and timers, find and fetch photos, read Health, motion and music, and leave an email or text for you to send. When you ask in the app, posts the bot's answer back to the Telegram or Discord chat a conversation came from. Tells a restart script which chats typed in the app are mid-reply, so a restart can wait for them. Keeps a bot's Lock Screen card in the app live while the phone is locked: each step the bot takes (Running npm test…, the two before it, how many) is pushed to the card, sealed so only your phone can read it, and the card says Done when the turn ends. Opens a shell on this computer for the app's Terminal page (your login shell, as an SSH login would, or PowerShell on Windows; plugin-data's terminal.off turns it off). Mints the app's Grok Live voice session a short-lived xAI token from your Grok subscription sign-in only, never an API key (the bearer itself never reaches the phone). Keeps the names Hermes gives new chats short enough for one line of an iPhone screen. Gives your bots a skill for the app's Dashboard (hermes-hq-push:dashboard-tile): a page that fills its tile at any size, checked at every size, kept fresh by a scheduled job. Adds a shared Tasks list between you and your bots: a task can be yours, a bot's, or split into steps for each of you; a bot can flag its own work to get ready ahead of time (research and drafts only — never send, book, buy, pay, post or delete), and tells you on your phone when its part is ready or needs you. Once you turn on Ideas, one bot looks over your recent chats each day and suggests a few tasks on the Tasks page's Ideas tab (nothing becomes a task until you add it). Replaces dispatch-push (its registered phones carry over)."
author: Hermes HQ
provides_tools: [device_contacts_search, device_request_result, tasks_list, tasks_add, tasks_update, tasks_next_prep, tasks_ideas]
provides_hooks: [pre_approval_request, post_approval_response, pre_tool_call, on_human_input_request, on_human_input_resolved, pre_llm_call, on_session_end]
optional_env:
  - name: HERMES_HQ_APNS_KEY_PATH
    description: "Direct mode: path to the app's APNs auth key (.p8). Only the app's developer has this. (DISPATCH_APNS_KEY_PATH still works.)"
  - name: HERMES_HQ_APNS_KEY_ID
    description: "Direct mode: the APNs key's Key ID (DISPATCH_APNS_KEY_ID still works)"
  - name: HERMES_HQ_APNS_TEAM_ID
    description: "Direct mode: the Apple Developer Team ID that owns the app (DISPATCH_APNS_TEAM_ID still works)"
  - name: HERMES_HQ_PUSH_RELAY_URL
    description: "Another push relay's HTTPS URL, or `off` to send nothing. Unset, alerts go through the public Hermes HQ relay, sealed so it can't read them. (DISPATCH_PUSH_RELAY_URL still works.)"
  - name: HERMES_HQ_PUSH_RELAY_KEY
    description: "Only for a private relay that asks for a key (DISPATCH_PUSH_RELAY_KEY still works)"
    password: true
