name: hermes-hq-proactive
version: "0.4.0-beta.2"
manifest_version: 2
kind: standalone
label: "Proactivity (Beta)"
description: "Beta, off by default. Keeps track of what is left open in your own chats with a bot (things you said you would do, things you are waiting on, things the bot said it would come back to), closes them when the chat shows they got done, and speaks up when one is due or has gone quiet: the bot looks into it, reading only, and messages you in its own chat with what it found. A short brief is posted there each morning too. Nothing is sent to anyone else, booked, paid, posted or deleted without you."
author: Hermes HQ
license: MIT
requires_hermes: ">=0.22"
tags: [beta, proactivity, open-loops, briefing, dashboard]
provides_tools:
  - proactive_loop_track
  - proactive_loop_resolve
  - proactive_loop_list
  - proactive_offer
  - proactive_feedback
  - proactive_watch_add
  - proactive_brief_get
provides_hooks:
  - pre_llm_call
  - post_llm_call
  - pre_tool_call
  - on_session_end
config_schema:
  enabled:
    type: bool
    default: false
    label: "Turn on Proactivity (Beta)"
    description: "Off by default. While it is off nothing is added to chats, the bot has no Proactivity tools, and no checks run."
  autonomy_mode:
    type: str
    default: "prep"
    choices: ["observe", "prep", "full"]
    label: "How much it does"
    description: "observe = only keeps track and writes the brief. prep = also speaks up about what it finds (recommended). full = the same as prep, and something past its date is marked Time-sensitive and comes first. No mode sends anything to anyone else or changes anything by itself."
  in_turn_enabled:
    type: bool
    default: true
    label: "Go one step further in chats"
    description: "Asks the bot to do the one obvious read-only check and tell you what it found, instead of stopping at a suggestion."
  loop_radar_enabled:
    type: bool
    default: true
    label: "Keep track of what is left open"
    description: "Notes things you say you will do, things you are waiting on, and things the bot says it will come back to. Kept apart from your task list."
  idle_sweep_enabled:
    type: bool
    default: true
    label: "Check every hour"
    description: "About once an hour while the bot is idle, looks at what is due, overdue or has gone quiet. Costs nothing when there is nothing new."
  daily_brief_enabled:
    type: bool
    default: true
    label: "Morning brief in the bot's chat"
    description: "Once a day, posts a few lines in this bot's chat: what is open and what was suggested. Says nothing on a day with nothing to report."
  pattern_detection_enabled:
    type: bool
    default: true
    label: "Notice repeated requests"
    description: "When you ask for much the same multi-step thing three times, suggests making it a skill or a scheduled job."
  allow_llm_in_sweep:
    type: bool
    default: true
    label: "Let the check use a model"
    description: "Lets the hourly check use a small model to read new chat messages and write short drafts. Off: it only uses fixed rules, at no cost."
  scan_recent_chats:
    type: bool
    default: true
    label: "Read your recent chats"
    description: "The check reads new messages in your own one-to-one chats with this bot to find what is left open and what got done. It never reads group chats, scheduled jobs or helper agents, and never changes a chat."
  scan_lookback_hours:
    type: int
    default: 72
    label: "How far back to read the first time (hours)"
    description: "On the first check, how many hours of chats to read. After that each chat is read from where the last check stopped."
  finds_go_to:
    type: str
    default: "chat"
    choices: ["chat", "ideas", "page"]
    label: "When it finds something"
    description: "chat = the bot messages you in its own chat (recommended). ideas = it becomes a card in Tasks › Ideas in the Hermes HQ app, where Add & Start has the bot do it. page = it stays on the Proactivity page. A place that is not there falls back to the next one."
  chat_lookup:
    type: bool
    default: true
    label: "Look into it before messaging"
    description: "The bot first looks the thing up, reading only (search, files, earlier chats), and tells you what it found. Off: it only tells you what is open and what it could do next."
  daily_message_budget:
    type: int
    default: 3
    label: "Most messages a day"
    description: "The most messages the bot writes you on its own in any 24 hours. One message can cover up to three finds. The morning brief is separate."
  ideas_inbox:
    type: bool
    default: true
    label: "Older setting: send finds to Tasks › Ideas"
    description: "From 0.3.0, replaced by \"When it finds something\". Only read when that has never been set: off here keeps finds on the Proactivity page."
  daily_offer_budget:
    type: int
    default: 6
    label: "Most finds a day"
    description: "The most new finds in any 24 hours, wherever they go."
  daily_interrupt_budget:
    type: int
    default: 2
    label: "Most Time-sensitive suggestions a day"
    description: "The most suggestions marked Time-sensitive in any 24 hours (only in the 'full' mode, never in quiet hours)."
  quiet_start:
    type: str
    default: "22:00"
    label: "Quiet hours start (HH:MM)"
    description: "From this time, on the clock Hermes is set to, nothing is marked Time-sensitive and the check uses no model."
  quiet_end:
    type: str
    default: "08:00"
    label: "Quiet hours end (HH:MM)"
    description: "When quiet hours end."
  brief_hour:
    type: int
    default: 8
    label: "Morning brief hour (0-23)"
    description: "The hour the morning brief is posted, on the clock Hermes is set to."
  stale_waiting_days:
    type: int
    default: 3
    label: "Days before a nudge"
    description: "How many days something you are waiting on can sit with no news before a follow-up is suggested."
  max_context_loops:
    type: int
    default: 3
    label: "Open items mentioned per message"
    description: "The most open items the bot is reminded of in one message, so little is added to each chat turn."
  focus_note:
    type: str
    default: ""
    label: "Watch for"
    description: "In your own words, what this bot should look out for."
  skip_note:
    type: str
    default: ""
    label: "Leave alone"
    description: "In your own words, what this bot should never bring up."
